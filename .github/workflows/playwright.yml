name: Playwright QA + AI RCA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 05:00 Asia/Karachi (PKT, UTC+5, no DST) = 00:00 UTC. Cron runs on the default branch only.
    - cron: '0 0 * * *'

# One run per ref; a newer PR push cancels the older run.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PW_WORKERS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Typecheck does not block the tests: its result is enforced by the final gate.
      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npx playwright test

      - name: Collect deterministic failure bundle
        if: always()
        run: npm run rca:collect

      # Model-free by default. AI_API_KEY is only exposed to trusted (non-fork) runs.
      - name: RCA analysis
        if: always()
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: npm run rca:analyze

      - name: Upload reports, traces and RCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            reports/rca/
          if-no-files-found: warn
          retention-days: 14

      # Final gate: artifacts are uploaded first, then the job reflects the real outcome.
      - name: Propagate status
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          echo "typecheck=$TYPECHECK tests=$TESTS"
          if [ "$TYPECHECK" != "success" ] || [ "$TESTS" != "success" ]; then
            echo "Failing: see reports/rca/rca-summary.md"
            exit 1
          fi

  # Runs the deliberately-failing fault suite and grades the RCA against the known answer.
  # Separate job so an injected fault never pollutes the real suite's pass rate.
  fault-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PW_WORKERS: 1
      FAULT_INJECTION: all
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Two commits so the analyzer can diff HEAD~1..HEAD and spot a changed spec.
          fetch-depth: 2

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Offline guard: replays recorded real failures (escape codes and all) through the
      # classifier. Catches a rule regression even when the public site is unavailable.
      - name: RCA classifier self-test
        run: npm run rca:selftest

      # These tests are expected to fail: that is the injected fault.
      - name: Run injected faults
        continue-on-error: true
        run: npx playwright test tests/fault

      - name: Collect and analyse
        if: always()
        run: |
          npm run rca:collect
          npm run rca:analyze

      # The real gate: each injected fault must receive its expected classification.
      - name: Verify RCA classified each injection correctly
        if: always()
        run: npm run rca:verify

      - name: Upload fault-injection RCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-injection-rca-${{ github.run_id }}
          path: |
            reports/rca/
            test-results/
          if-no-files-found: warn
          retention-days: 14
